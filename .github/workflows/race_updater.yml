name: Daily Race Auto Updater

on:
  schedule:
    - cron: '0 */3 * * *' 
  workflow_dispatch: 

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Race Updater Script
        run: node update_race.js
